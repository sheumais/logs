name: Release

on:
  push:
    branches:
      - release

jobs:
  build:
    strategy:
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add wasm target for Yew
        run: rustup target add wasm32-unknown-unknown

      - name: Install Trunk (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -L https://github.com/trunk-rs/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf -
          sudo mv trunk /usr/local/bin/

      - name: Install Trunk (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -L https://github.com/trunk-rs/trunk/releases/latest/download/trunk-aarch64-apple-darwin.tar.gz | tar -xzf -
          sudo mv trunk /usr/local/bin/

      - name: Install Trunk (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/trunk-rs/trunk/releases/latest/download/trunk-x86_64-pc-windows-msvc.zip -OutFile trunk.zip
          Expand-Archive -Path trunk.zip -DestinationPath .
          echo "$PWD" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Tauri Build
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop
          distPath: dist
          tauriScript: ""
          tagName: v__VERSION__
          releaseName: 'v__VERSION__'
          releaseBody: |
            See the assets to download this version and install.

            Windows users are recommended to download the x64_en-US.msi installer.
          releaseDraft: true
          prerelease: false
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}