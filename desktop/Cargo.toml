[package]
name = "esologtool-ui"
version = "0.6.0"
edition = "2021"

[dependencies]
yew = { version = "0.23", features = ["csr"] }
yew-router = "0.20"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1.7"
gloo-utils = "0.3.0"
parser = { path = "../parser" }
esologtool-common = {path = "./common" }
#yew_icons = {version = "0.10", features = ["LucideArrowLeftCircle", "LucideUpload", "BootstrapFileEarmarkBreak", "BootstrapGithub", "BootstrapFileEarmarkBarGraph", "BootstrapFiles", "BootstrapFolder", "BootstrapFileEarmarkArrowUp", "BootstrapFolderSymlink", "BootstrapPersonCircle", "LucideLogOut", "BootstrapXLg", "BootstrapDiscord", "BootstrapTrash3", "BootstrapFileEarmarkPlay"]}
yew_icons = {version = "0.10", features = ["lucide", "bootstrap"]}
stylist = {version = "0.15", features = ["yew_integration"]}
tauri-sys = { git = "https://github.com/JonasKruckenberg/tauri-sys", branch = "v2", features = ["all"] }
futures = "0.3.33"
ftail = "0.3.1"
log = "0.4.33"
